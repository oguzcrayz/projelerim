<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision War - RTS Prototype</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0a0a0a;
        }
        #game-container {
            border: 3px solid #333;
            box-shadow: 0 0 20px rgba(0, 100, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
// ==========================================
// VISION WAR - RTS PROTOTYPE
// Fog of War + EW + Triangülasyon + Counter-Vision
// ==========================================

// === KONFIGÜRASYON ===
const CONFIG = {
    // Ekran ayarları
    width: 1024,
    height: 768,
    backgroundColor: 0x1a2f1a,

    // Drone ayarları
    drone: {
        count: 4,
        speed: 150,
        visionRadius: 100,
        color: 0x4488ff,
        selectedColor: 0xffff00,
        size: 16,
        startX: 512,
        startY: 650,
        spacing: 50
    },

    // Düşman ayarları
    enemy: {
        tank: {
            color: 0xff3333,
            size: 24
        },
        patrol: {
            color: 0xff3333,
            size: 16,
            speed: 50,
            minX: 400,
            maxX: 600,
            visionAngle: 120,
            visionRange: 80
        }
    },

    // EW (Elektronik Harp) ayarları
    ew: {
        x: 500,
        y: 150,
        radius: 150,
        color: 0xffcc00,
        activationTime: 60,
        size: 20,
        jammingTransitionTime: 2000,
        commandDelay: 500
    },

    // RF / Triangülasyon ayarları
    rf: {
        x: 500,
        y: 180,
        detectionZoneY: 400,
        signalLineLength: 200,
        localizationThreshold: 50
    },

    // Topçu atışı ayarları
    artillery: {
        countdownDuration: 3000,
        explosionRadius: 80
    },

    // Counter-Vision ayarları
    counterVision: {
        startY: 100,
        endY: 600,
        speed: 30, // px/saniye
        activationAfterEWDestroyed: 10, // EW yok edildikten 10sn sonra
        activationTime: 120, // Veya oyun başladıktan 120sn sonra
        artilleryCountdown: 30 // Tarama tamamlandıktan sonra 30sn
    },

    // Decoy ayarları
    decoy: {
        duration: 60, // 60 saniye aktif
        delayTime: 20, // Düşmanı 20 saniye oyalar
        color: 0x00ff00
    },

    // Fog of War ayarları
    fog: {
        unexploredAlpha: 1.0,
        exploredAlpha: 0.5,
        visibleAlpha: 0
    },

    // Oyun ayarları
    game: {
        duration: 300,
        detectionMessageDuration: 2000,
        droneDestroyDelay: 3000
    }
};

// === OYUN DEĞİŞKENLERİ ===
let drones = [];
let enemies = [];
let selectedDrone = null;
let fogGraphics, fogMask, exploredMask;
let exploredAreas = [];
let detectedEnemies = new Set();
let gameTimer;
let remainingTime;
let gameOver = false;

// EW değişkenleri
let ewSource = null;
let ewActive = false;
let ewDestroyed = false;
let ewDestroyedTime = 0;
let ewAreaGraphics = null;
let ewStatusText = null;
let ewBorderGraphics = null;
let ewPulseTween = null;

// RF/Triangülasyon değişkenleri
let rfSignalGraphics = null;
let rfStatusText = null;
let rfLocalized = false;
let localizedPoint = null;
let localizedMarker = null;
let artilleryReady = false;
let artilleryFiring = false;
let artilleryText = null;

// Counter-Vision değişkenleri
let counterVisionActive = false;
let counterVisionY = CONFIG.counterVision.startY;
let counterVisionGraphics = null;
let counterVisionPaused = false;
let counterVisionPauseTime = 0;
let counterVisionReachedEnd = false;
let enemyArtilleryCountdown = 0;
let counterVisionStatusText = null;
let counterVisionWarningText = null;
let detectedDrones = new Set();

// Decoy değişkenleri
let decoyCount = 1;
let decoyMode = false;
let decoyPlaced = null;
let decoyActive = false;
let decoyTimer = 0;
let decoyGraphics = null;
let decoyText = null;
let decoyPreview = null;

// UI elementleri
let droneCountText, detectionCountText, timerText, messageText;

// === ANA SAHNE ===
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
    }

    create() {
        this.resetGameState();
        this.createBackground();
        this.createDrones();
        this.createEnemies();
        this.createEWSource();
        this.createRFSignalSystem();
        this.createCounterVisionSystem();
        this.createDecoySystem();
        this.createFogOfWar();
        this.createEWBorderEffect();
        this.createUI();
        this.setupInput();
        this.startTimer();
        this.scheduleEWActivation();
    }

    resetGameState() {
        drones = [];
        enemies = [];
        selectedDrone = null;
        exploredAreas = [];
        detectedEnemies = new Set();
        gameOver = false;
        remainingTime = CONFIG.game.duration;
        ewActive = false;
        ewDestroyed = false;
        ewDestroyedTime = 0;
        ewSource = null;
        ewAreaGraphics = null;
        ewStatusText = null;
        ewBorderGraphics = null;
        ewPulseTween = null;
        rfSignalGraphics = null;
        rfStatusText = null;
        rfLocalized = false;
        localizedPoint = null;
        localizedMarker = null;
        artilleryReady = false;
        artilleryFiring = false;
        artilleryText = null;
        counterVisionActive = false;
        counterVisionY = CONFIG.counterVision.startY;
        counterVisionGraphics = null;
        counterVisionPaused = false;
        counterVisionPauseTime = 0;
        counterVisionReachedEnd = false;
        enemyArtilleryCountdown = 0;
        counterVisionStatusText = null;
        counterVisionWarningText = null;
        detectedDrones = new Set();
        decoyCount = 1;
        decoyMode = false;
        decoyPlaced = null;
        decoyActive = false;
        decoyTimer = 0;
        decoyGraphics = null;
        decoyText = null;
        decoyPreview = null;
    }

    createBackground() {
        const graphics = this.add.graphics();
        graphics.lineStyle(1, 0x2a4f2a, 0.3);

        for (let x = 0; x <= CONFIG.width; x += 50) {
            graphics.moveTo(x, 0);
            graphics.lineTo(x, CONFIG.height);
        }

        for (let y = 0; y <= CONFIG.height; y += 50) {
            graphics.moveTo(0, y);
            graphics.lineTo(CONFIG.width, y);
        }

        graphics.strokePath();

        // RF tespit bölgesi çizgisi
        graphics.lineStyle(2, 0x00ff00, 0.2);
        graphics.moveTo(0, CONFIG.rf.detectionZoneY);
        graphics.lineTo(CONFIG.width, CONFIG.rf.detectionZoneY);
        graphics.strokePath();

        const rfZoneLabel = this.add.text(10, CONFIG.rf.detectionZoneY - 25, '▲ RF TESPİT BÖLGESİ', {
            fontFamily: 'Arial',
            fontSize: '12px',
            color: '#00ff00',
            alpha: 0.5
        });
        rfZoneLabel.setAlpha(0.4);
    }

    // === COUNTER-VISION SİSTEMİ ===
    createCounterVisionSystem() {
        counterVisionGraphics = this.add.graphics();
        counterVisionGraphics.setDepth(90);
    }

    checkCounterVisionActivation() {
        if (counterVisionActive || gameOver) return;

        const elapsedTime = CONFIG.game.duration - remainingTime;

        // EW yok edildikten 10sn sonra VEYA oyun başladıktan 120sn sonra
        const shouldActivate =
            (ewDestroyed && (this.time.now - ewDestroyedTime) >= CONFIG.counterVision.activationAfterEWDestroyed * 1000) ||
            (elapsedTime >= CONFIG.counterVision.activationTime);

        if (shouldActivate) {
            this.activateCounterVision();
        }
    }

    activateCounterVision() {
        counterVisionActive = true;
        counterVisionY = CONFIG.counterVision.startY;

        this.showMessage('⚠️ DÜŞMAN KEŞİF TARAMASI BAŞLADI!', 3000);

        // UI güncelle
        if (counterVisionWarningText) {
            counterVisionWarningText.setVisible(true);
        }
    }

    updateCounterVision(delta) {
        if (!counterVisionActive || gameOver) return;

        // Decoy tarafından duraklatıldı mı?
        if (counterVisionPaused) {
            counterVisionPauseTime -= delta;
            if (counterVisionPauseTime <= 0) {
                counterVisionPaused = false;
                this.showMessage('🔄 Düşman taraması devam ediyor!', 2000);

                // Decoy'u patlat
                if (decoyPlaced) {
                    this.destroyDecoy();
                }
            }
            return;
        }

        // Tarama çizgisini hareket ettir
        counterVisionY += CONFIG.counterVision.speed * (delta / 1000);

        // Drone tespiti
        drones.forEach(drone => {
            if (!drone.droneData.isAlive) return;
            if (detectedDrones.has(drone.droneData.index)) return;

            // Çizgi drone'a değdi mi?
            if (Math.abs(drone.y - counterVisionY) < 10) {
                detectedDrones.add(drone.droneData.index);
                this.showMessage(`⚠️ DRONE #${drone.droneData.index + 1} TESPİT EDİLDİ!`, 2000);
                drone.setTint(0xff6666);
            }
        });

        // Decoy kontrolü
        if (decoyPlaced && decoyActive && !counterVisionPaused) {
            if (Math.abs(decoyPlaced.y - counterVisionY) < 10) {
                this.onDecoyDetected();
            }
        }

        // Bitiş kontrolü
        if (counterVisionY >= CONFIG.counterVision.endY && !counterVisionReachedEnd) {
            counterVisionReachedEnd = true;
            this.onCounterVisionComplete();
        }
    }

    onCounterVisionComplete() {
        this.showMessage('💀 KONUMUNUZ TESPİT EDİLDİ! Topçu atışı geliyor!', 3000);
        enemyArtilleryCountdown = CONFIG.counterVision.artilleryCountdown;

        // Geri sayım başlat
        this.time.addEvent({
            delay: 1000,
            callback: () => {
                if (gameOver) return;

                enemyArtilleryCountdown--;

                if (enemyArtilleryCountdown <= 0) {
                    this.endGame(false, 'TOPÇU ATIŞI ALDINIZ!');
                }
            },
            repeat: CONFIG.counterVision.artilleryCountdown - 1
        });
    }

    drawCounterVision() {
        counterVisionGraphics.clear();

        if (!counterVisionActive || gameOver) return;

        // Taranmış alan (kırmızı tint)
        counterVisionGraphics.fillStyle(0xff0000, 0.1);
        counterVisionGraphics.fillRect(0, CONFIG.counterVision.startY, CONFIG.width, counterVisionY - CONFIG.counterVision.startY);

        // Tarama çizgisi
        counterVisionGraphics.lineStyle(3, 0xff0000, 0.8);
        counterVisionGraphics.beginPath();
        counterVisionGraphics.moveTo(0, counterVisionY);
        counterVisionGraphics.lineTo(CONFIG.width, counterVisionY);
        counterVisionGraphics.strokePath();

        // Animasyonlu efekt
        const pulse = Math.sin(this.time.now / 200) * 0.3 + 0.7;
        counterVisionGraphics.lineStyle(5, 0xff0000, pulse * 0.3);
        counterVisionGraphics.beginPath();
        counterVisionGraphics.moveTo(0, counterVisionY);
        counterVisionGraphics.lineTo(CONFIG.width, counterVisionY);
        counterVisionGraphics.strokePath();

        // Duraklatma göstergesi
        if (counterVisionPaused) {
            counterVisionGraphics.fillStyle(0xffff00, 0.3);
            counterVisionGraphics.fillCircle(decoyPlaced ? decoyPlaced.x : CONFIG.width / 2, counterVisionY, 30);
        }
    }

    // === DECOY SİSTEMİ ===
    createDecoySystem() {
        decoyGraphics = this.add.graphics();
        decoyGraphics.setDepth(85);

        // Decoy önizleme (fare takip)
        decoyPreview = this.add.circle(0, 0, 15, CONFIG.decoy.color, 0.3);
        decoyPreview.setStrokeStyle(2, CONFIG.decoy.color, 0.5);
        decoyPreview.setVisible(false);
        decoyPreview.setDepth(200);
    }

    toggleDecoyMode() {
        if (decoyCount <= 0 || decoyPlaced) {
            this.showMessage('❌ Decoy kullanılamaz!', 1000);
            return;
        }

        decoyMode = !decoyMode;
        decoyPreview.setVisible(decoyMode);

        if (decoyMode) {
            this.showMessage('📡 Decoy modu aktif - Sol tık ile yerleştir', 2000);
        }
    }

    updateDecoyPreview(pointer) {
        if (decoyMode && decoyPreview) {
            decoyPreview.x = pointer.x;
            decoyPreview.y = pointer.y;
        }
    }

    placeDecoy(x, y) {
        if (decoyCount <= 0 || decoyPlaced) return;

        decoyCount--;
        decoyMode = false;
        decoyPreview.setVisible(false);

        // Decoy oluştur
        decoyPlaced = {
            x: x,
            y: y,
            graphics: this.add.graphics(),
            pulseCircle: this.add.circle(x, y, 10, CONFIG.decoy.color, 0.5)
        };

        decoyPlaced.graphics.setDepth(86);
        decoyPlaced.pulseCircle.setDepth(85);

        // Pulse animasyonu
        this.tweens.add({
            targets: decoyPlaced.pulseCircle,
            scale: { from: 1, to: 3 },
            alpha: { from: 0.5, to: 0 },
            duration: 1500,
            repeat: -1
        });

        decoyActive = true;
        decoyTimer = CONFIG.decoy.duration;

        this.showMessage('📡 DECOY YERLEŞTİRİLDİ!', 2000);

        // Decoy süresi
        this.time.addEvent({
            delay: 1000,
            callback: () => {
                if (!decoyActive) return;
                decoyTimer--;
                if (decoyTimer <= 0) {
                    this.destroyDecoy();
                }
            },
            repeat: CONFIG.decoy.duration - 1
        });
    }

    onDecoyDetected() {
        if (!decoyActive || counterVisionPaused) return;

        counterVisionPaused = true;
        counterVisionPauseTime = CONFIG.decoy.delayTime * 1000;

        this.showMessage('🎯 DÜŞMAN YANILDI! Sahte hedefi tarıyor...', 3000);
    }

    destroyDecoy() {
        if (!decoyPlaced) return;

        // Patlama efekti
        const explosion = this.add.circle(decoyPlaced.x, decoyPlaced.y, 10, 0x00ff00, 1);
        this.tweens.add({
            targets: explosion,
            scale: 5,
            alpha: 0,
            duration: 500,
            onComplete: () => explosion.destroy()
        });

        // Temizle
        if (decoyPlaced.graphics) decoyPlaced.graphics.destroy();
        if (decoyPlaced.pulseCircle) decoyPlaced.pulseCircle.destroy();

        decoyPlaced = null;
        decoyActive = false;

        this.showMessage('💥 Decoy yok edildi!', 2000);
    }

    drawDecoy() {
        if (!decoyPlaced || !decoyActive) return;

        decoyGraphics.clear();

        // Ana nokta
        decoyGraphics.fillStyle(CONFIG.decoy.color, 0.8);
        decoyGraphics.fillCircle(decoyPlaced.x, decoyPlaced.y, 8);

        // RF dalga efekti
        const time = this.time.now;
        for (let i = 0; i < 3; i++) {
            const radius = ((time / 1000 + i * 0.33) % 1) * 50;
            const alpha = 0.5 * (1 - radius / 50);
            decoyGraphics.lineStyle(2, 0x4488ff, alpha);
            decoyGraphics.strokeCircle(decoyPlaced.x, decoyPlaced.y, radius);
        }
    }

    // === RF SİNYAL SİSTEMİ ===
    createRFSignalSystem() {
        rfSignalGraphics = this.add.graphics();
        rfSignalGraphics.setDepth(95);
    }

    updateRFSignals() {
        rfSignalGraphics.clear();

        if (ewDestroyed) return;

        const detectingDrones = drones.filter(drone =>
            drone.droneData.isAlive && drone.y < CONFIG.rf.detectionZoneY
        );

        detectingDrones.forEach(drone => {
            const angle = Math.atan2(CONFIG.rf.y - drone.y, CONFIG.rf.x - drone.x);
            const startX = drone.x;
            const startY = drone.y;
            const endX = drone.x + Math.cos(angle) * CONFIG.rf.signalLineLength;
            const endY = drone.y + Math.sin(angle) * CONFIG.rf.signalLineLength;

            this.drawDashedLine(rfSignalGraphics, startX, startY, endX, endY, 0x00ff00, 0.8, 10, 5);

            rfSignalGraphics.fillStyle(0x00ff00, 0.5);
            rfSignalGraphics.fillCircle(drone.x, drone.y - 25, 5);
        });

        if (detectingDrones.length >= 2 && !rfLocalized) {
            this.calculateTriangulation(detectingDrones);
        }
    }

    drawDashedLine(graphics, x1, y1, x2, y2, color, alpha, dashLength, gapLength) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const dashCount = Math.floor(distance / (dashLength + gapLength));

        graphics.lineStyle(2, color, alpha);

        for (let i = 0; i < dashCount; i++) {
            const startRatio = (i * (dashLength + gapLength)) / distance;
            const endRatio = (i * (dashLength + gapLength) + dashLength) / distance;

            const sx = x1 + dx * startRatio;
            const sy = y1 + dy * startRatio;
            const ex = x1 + dx * endRatio;
            const ey = y1 + dy * endRatio;

            graphics.beginPath();
            graphics.moveTo(sx, sy);
            graphics.lineTo(ex, ey);
            graphics.strokePath();
        }
    }

    calculateTriangulation(detectingDrones) {
        const drone1 = detectingDrones[0];
        const drone2 = detectingDrones[1];

        const angle1 = Math.atan2(CONFIG.rf.y - drone1.y, CONFIG.rf.x - drone1.x);
        const angle2 = Math.atan2(CONFIG.rf.y - drone2.y, CONFIG.rf.x - drone2.x);

        const intersection = this.lineIntersection(
            drone1.x, drone1.y, angle1,
            drone2.x, drone2.y, angle2
        );

        if (intersection) {
            const distanceToReal = Phaser.Math.Distance.Between(
                intersection.x, intersection.y,
                CONFIG.rf.x, CONFIG.rf.y
            );

            if (distanceToReal <= CONFIG.rf.localizationThreshold) {
                this.onLocalizationSuccess(intersection);
            } else {
                this.showApproximateLocation(intersection);
            }
        }
    }

    lineIntersection(x1, y1, angle1, x2, y2, angle2) {
        const d1x = Math.cos(angle1);
        const d1y = Math.sin(angle1);
        const d2x = Math.cos(angle2);
        const d2y = Math.sin(angle2);

        const cross = d1x * d2y - d1y * d2x;

        if (Math.abs(cross) < 0.0001) return null;

        const dx = x2 - x1;
        const dy = y2 - y1;

        const t = (dx * d2y - dy * d2x) / cross;

        return {
            x: x1 + t * d1x,
            y: y1 + t * d1y
        };
    }

    onLocalizationSuccess(point) {
        rfLocalized = true;
        localizedPoint = point;
        artilleryReady = true;

        this.showMessage('📡 SİNYAL KAYNAĞI LOKALİZE EDİLDİ!', 3000);
        this.createLocalizedMarker(point);
        this.updateRFStatusUI();
    }

    showApproximateLocation(point) {
        rfSignalGraphics.fillStyle(0x00ff00, 0.2);
        rfSignalGraphics.fillCircle(point.x, point.y, 30);
        rfSignalGraphics.lineStyle(1, 0x00ff00, 0.5);
        rfSignalGraphics.strokeCircle(point.x, point.y, 30);
    }

    createLocalizedMarker(point) {
        localizedMarker = this.add.circle(point.x, point.y, 15, 0x00ff00, 0.3);
        localizedMarker.setStrokeStyle(2, 0x00ff00, 1);
        localizedMarker.setDepth(96);

        this.tweens.add({
            targets: localizedMarker,
            scale: { from: 1, to: 1.5 },
            alpha: { from: 0.5, to: 0.2 },
            duration: 800,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });

        const crossGraphics = this.add.graphics();
        crossGraphics.setDepth(97);
        crossGraphics.lineStyle(2, 0x00ff00, 0.8);
        crossGraphics.moveTo(point.x - 20, point.y);
        crossGraphics.lineTo(point.x + 20, point.y);
        crossGraphics.moveTo(point.x, point.y - 20);
        crossGraphics.lineTo(point.x, point.y + 20);
        crossGraphics.strokePath();
    }

    // === EW KAYNAĞI ===
    createEWSource() {
        ewAreaGraphics = this.add.graphics();
        ewAreaGraphics.setDepth(5);

        const hexGraphics = this.add.graphics();
        const size = CONFIG.ew.size;
        const x = CONFIG.ew.x;
        const y = CONFIG.ew.y;

        hexGraphics.fillStyle(CONFIG.ew.color, 1);
        hexGraphics.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i - Math.PI / 2;
            const px = x + size * Math.cos(angle);
            const py = y + size * Math.sin(angle);
            if (i === 0) hexGraphics.moveTo(px, py);
            else hexGraphics.lineTo(px, py);
        }
        hexGraphics.closePath();
        hexGraphics.fillPath();

        hexGraphics.lineStyle(2, 0xffffff, 0.8);
        hexGraphics.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i - Math.PI / 2;
            const px = x + size * Math.cos(angle);
            const py = y + size * Math.sin(angle);
            if (i === 0) hexGraphics.moveTo(px, py);
            else hexGraphics.lineTo(px, py);
        }
        hexGraphics.closePath();
        hexGraphics.strokePath();

        hexGraphics.setDepth(10);

        ewSource = {
            graphics: hexGraphics,
            x: CONFIG.ew.x,
            y: CONFIG.ew.y,
            radius: CONFIG.ew.radius
        };

        const ewLabel = this.add.text(x, y, 'EW', {
            fontFamily: 'Arial Black',
            fontSize: '12px',
            color: '#000000'
        });
        ewLabel.setOrigin(0.5, 0.5);
        ewLabel.setDepth(11);

        hexGraphics.setAlpha(0.3);
        ewLabel.setAlpha(0.3);

        ewSource.label = ewLabel;
    }

    scheduleEWActivation() {
        this.time.delayedCall(CONFIG.ew.activationTime * 1000, () => {
            if (gameOver || ewDestroyed) return;
            this.activateEW();
        });
    }

    activateEW() {
        ewActive = true;

        ewSource.graphics.setAlpha(1);
        ewSource.label.setAlpha(1);

        this.tweens.add({
            targets: [ewSource.graphics, ewSource.label],
            alpha: { from: 0.3, to: 1 },
            duration: 500,
            ease: 'Power2'
        });

        this.showMessage('⚡ EW SİSTEMİ AKTİF! ⚡', 3000);
        this.startEWBorderPulse();

        if (ewStatusText) {
            ewStatusText.setText('EW: AKTİF');
            ewStatusText.setColor('#ff3333');
        }
    }

    drawEWArea() {
        ewAreaGraphics.clear();

        if (!ewActive || ewDestroyed) return;

        ewAreaGraphics.fillStyle(CONFIG.ew.color, 0.2);
        ewAreaGraphics.fillCircle(CONFIG.ew.x, CONFIG.ew.y, CONFIG.ew.radius);

        ewAreaGraphics.lineStyle(2, CONFIG.ew.color, 0.5);
        ewAreaGraphics.strokeCircle(CONFIG.ew.x, CONFIG.ew.y, CONFIG.ew.radius);

        const time = this.time.now;
        for (let i = 0; i < 3; i++) {
            const waveRadius = ((time / 1000 + i * 0.33) % 1) * CONFIG.ew.radius;
            const alpha = 0.3 * (1 - waveRadius / CONFIG.ew.radius);
            ewAreaGraphics.lineStyle(1, CONFIG.ew.color, alpha);
            ewAreaGraphics.strokeCircle(CONFIG.ew.x, CONFIG.ew.y, waveRadius);
        }
    }

    createEWBorderEffect() {
        ewBorderGraphics = this.add.graphics();
        ewBorderGraphics.setDepth(250);
        ewBorderGraphics.setAlpha(0);
    }

    startEWBorderPulse() {
        if (ewPulseTween) ewPulseTween.stop();

        ewPulseTween = this.tweens.add({
            targets: ewBorderGraphics,
            alpha: { from: 0, to: 0.6 },
            duration: 1000,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });
    }

    drawEWBorder() {
        ewBorderGraphics.clear();

        if (!ewActive || ewDestroyed) return;

        const borderWidth = 15;

        for (let i = 0; i < borderWidth; i++) {
            const alpha = (1 - i / borderWidth) * 0.5;
            ewBorderGraphics.lineStyle(2, 0xff0000, alpha);

            ewBorderGraphics.moveTo(0, i);
            ewBorderGraphics.lineTo(CONFIG.width, i);
            ewBorderGraphics.moveTo(0, CONFIG.height - i);
            ewBorderGraphics.lineTo(CONFIG.width, CONFIG.height - i);
            ewBorderGraphics.moveTo(i, 0);
            ewBorderGraphics.lineTo(i, CONFIG.height);
            ewBorderGraphics.moveTo(CONFIG.width - i, 0);
            ewBorderGraphics.lineTo(CONFIG.width - i, CONFIG.height);

            ewBorderGraphics.strokePath();
        }
    }

    // === TOPÇU ATIŞI ===
    fireArtillery() {
        if (!artilleryReady || artilleryFiring || !localizedPoint) return;

        artilleryFiring = true;

        const targetMarker = this.add.graphics();
        targetMarker.setDepth(200);
        targetMarker.lineStyle(3, 0xff0000, 1);
        targetMarker.strokeCircle(localizedPoint.x, localizedPoint.y, 30);
        targetMarker.moveTo(localizedPoint.x - 40, localizedPoint.y);
        targetMarker.lineTo(localizedPoint.x + 40, localizedPoint.y);
        targetMarker.moveTo(localizedPoint.x, localizedPoint.y - 40);
        targetMarker.lineTo(localizedPoint.x, localizedPoint.y + 40);
        targetMarker.strokePath();

        const countdownText = this.add.text(localizedPoint.x, localizedPoint.y - 60, '3', {
            fontFamily: 'Arial Black',
            fontSize: '48px',
            color: '#ff0000',
            stroke: '#000000',
            strokeThickness: 4
        });
        countdownText.setOrigin(0.5, 0.5);
        countdownText.setDepth(201);

        this.showMessage('🎯 TOPÇU ATIŞI GELİYOR!', 3000);

        let countdown = 3;
        this.time.addEvent({
            delay: 1000,
            callback: () => {
                countdown--;
                if (countdown > 0) {
                    countdownText.setText(countdown.toString());
                } else {
                    countdownText.destroy();
                    targetMarker.destroy();
                    this.executeArtilleryStrike(localizedPoint);
                }
            },
            repeat: 2
        });
    }

    executeArtilleryStrike(point) {
        const explosion = this.add.circle(point.x, point.y, 10, 0xff6600, 1);
        explosion.setDepth(202);

        this.tweens.add({
            targets: explosion,
            scale: { from: 1, to: CONFIG.artillery.explosionRadius / 10 },
            alpha: { from: 1, to: 0 },
            duration: 800,
            ease: 'Power2',
            onComplete: () => explosion.destroy()
        });

        const ring = this.add.circle(point.x, point.y, 20);
        ring.setStrokeStyle(5, 0xffaa00, 1);
        ring.setDepth(201);

        this.tweens.add({
            targets: ring,
            scale: { from: 1, to: 5 },
            alpha: { from: 1, to: 0 },
            duration: 1000,
            ease: 'Power1',
            onComplete: () => ring.destroy()
        });

        this.cameras.main.shake(500, 0.02);
        this.destroyEW();

        if (localizedMarker) localizedMarker.destroy();
    }

    destroyEW() {
        ewDestroyed = true;
        ewDestroyedTime = this.time.now;
        ewActive = false;

        if (ewSource) {
            ewSource.graphics.setVisible(false);
            ewSource.label.setVisible(false);
        }

        if (ewPulseTween) {
            ewPulseTween.stop();
            ewBorderGraphics.setAlpha(0);
        }

        drones.forEach(drone => {
            if (drone.droneData.isJammed) {
                this.onDroneExitJamming(drone);
            }
            drone.droneData.isJammed = false;
        });

        this.showMessage('💥 EW YOK EDİLDİ! Görüş geri kazanıldı!', 4000);

        if (ewStatusText) {
            ewStatusText.setText('EW: YOK EDİLDİ');
            ewStatusText.setColor('#00ff00');
        }

        artilleryReady = false;
        artilleryFiring = false;
    }

    updateRFStatusUI() {
        if (!rfStatusText) return;

        if (ewDestroyed) {
            rfStatusText.setText('RF: YOK EDİLDİ');
            rfStatusText.setColor('#00ff00');
            if (artilleryText) artilleryText.setText('');
        } else if (rfLocalized) {
            rfStatusText.setText('RF: LOKALİZE');
            rfStatusText.setColor('#00ff00');
            if (artilleryText && !artilleryFiring) {
                artilleryText.setText('TOPÇU ATIŞI HAZIR [SPACE]');
                artilleryText.setColor('#ffff00');
            }
        } else {
            const detectingDrones = drones.filter(drone =>
                drone.droneData.isAlive && drone.y < CONFIG.rf.detectionZoneY
            );

            if (detectingDrones.length > 0) {
                rfStatusText.setText(`RF: TESPİT (${detectingDrones.length} drone)`);
                rfStatusText.setColor('#ffaa00');
            } else {
                rfStatusText.setText('RF: ARANIYOR');
                rfStatusText.setColor('#888888');
            }
        }
    }

    // === DRONE OLUŞTURMA ===
    createDrone(x, y, index) {
        const graphics = this.add.graphics();

        graphics.fillStyle(CONFIG.drone.color);
        graphics.beginPath();
        graphics.moveTo(0, -CONFIG.drone.size);
        graphics.lineTo(-CONFIG.drone.size * 0.7, CONFIG.drone.size * 0.7);
        graphics.lineTo(CONFIG.drone.size * 0.7, CONFIG.drone.size * 0.7);
        graphics.closePath();
        graphics.fillPath();

        graphics.generateTexture('drone_' + index, CONFIG.drone.size * 2, CONFIG.drone.size * 2);
        graphics.destroy();

        const drone = this.add.sprite(x, y, 'drone_' + index);
        drone.setOrigin(0.5, 0.5);

        drone.droneData = {
            index: index,
            targetX: x,
            targetY: y,
            isMoving: false,
            isSelected: false,
            isAlive: true,
            visionRadius: CONFIG.drone.visionRadius,
            baseVisionRadius: CONFIG.drone.visionRadius,
            isJammed: false,
            currentVisionRadius: CONFIG.drone.visionRadius,
            pendingCommand: null,
            commandDelayTimer: null,
            jammingWarningShown: false
        };

        drone.highlight = this.add.circle(x, y, CONFIG.drone.size + 5);
        drone.highlight.setStrokeStyle(2, CONFIG.drone.selectedColor);
        drone.highlight.setVisible(false);

        drone.visionCircle = this.add.circle(x, y, CONFIG.drone.visionRadius);
        drone.visionCircle.setStrokeStyle(1, CONFIG.drone.color, 0.3);
        drone.visionCircle.setFillStyle(CONFIG.drone.color, 0.05);

        drone.jamIndicator = this.add.text(x, y - 30, '⚠️ JAMMING!', {
            fontFamily: 'Arial Black',
            fontSize: '12px',
            color: '#ff0000',
            stroke: '#000000',
            strokeThickness: 2
        });
        drone.jamIndicator.setOrigin(0.5, 0.5);
        drone.jamIndicator.setVisible(false);
        drone.jamIndicator.setDepth(150);

        return drone;
    }

    createDrones() {
        const startX = CONFIG.drone.startX - (CONFIG.drone.count - 1) * CONFIG.drone.spacing / 2;

        for (let i = 0; i < CONFIG.drone.count; i++) {
            const x = startX + i * CONFIG.drone.spacing;
            const drone = this.createDrone(x, CONFIG.drone.startY, i);
            drones.push(drone);
        }
    }

    // === EW ETKİ SİSTEMİ ===
    checkEWEffect() {
        if (!ewActive || ewDestroyed) return;

        drones.forEach(drone => {
            if (!drone.droneData.isAlive) return;

            const dist = Phaser.Math.Distance.Between(
                drone.x, drone.y,
                CONFIG.ew.x, CONFIG.ew.y
            );

            const wasJammed = drone.droneData.isJammed;
            drone.droneData.isJammed = dist <= CONFIG.ew.radius;

            if (drone.droneData.isJammed && !wasJammed) {
                this.onDroneEnterJamming(drone);
            } else if (!drone.droneData.isJammed && wasJammed) {
                this.onDroneExitJamming(drone);
            }

            if (drone.droneData.isJammed) {
                this.updateJammedDroneVision(drone);
            }
        });
    }

    onDroneEnterJamming(drone) {
        if (!drone.droneData.jammingWarningShown) {
            this.showMessage('⚠️ JAMMING! Bağlantı kesiliyor...', 2000);
            drone.droneData.jammingWarningShown = true;
        }

        drone.jamIndicator.setVisible(true);

        this.tweens.add({
            targets: drone.jamIndicator,
            alpha: { from: 1, to: 0.3 },
            duration: 200,
            yoyo: true,
            repeat: -1
        });

        this.cameras.main.shake(500, 0.005);

        this.tweens.add({
            targets: drone.droneData,
            currentVisionRadius: 0,
            duration: CONFIG.ew.jammingTransitionTime,
            ease: 'Power2',
            onUpdate: () => {
                drone.visionCircle.setRadius(drone.droneData.currentVisionRadius);
                drone.droneData.visionRadius = drone.droneData.currentVisionRadius;
            }
        });

        drone.setTint(0xffaa00);
    }

    onDroneExitJamming(drone) {
        this.showMessage('📡 Bağlantı yeniden kuruldu', 2000);

        drone.jamIndicator.setVisible(false);
        this.tweens.killTweensOf(drone.jamIndicator);

        this.tweens.add({
            targets: drone.droneData,
            currentVisionRadius: drone.droneData.baseVisionRadius,
            duration: CONFIG.ew.jammingTransitionTime,
            ease: 'Power2',
            onUpdate: () => {
                drone.visionCircle.setRadius(drone.droneData.currentVisionRadius);
                drone.droneData.visionRadius = drone.droneData.currentVisionRadius;
            }
        });

        drone.clearTint();
        drone.droneData.jammingWarningShown = false;
    }

    updateJammedDroneVision(drone) {
        if (Math.random() < 0.1) {
            this.cameras.main.shake(100, 0.002);
        }

        drone.jamIndicator.x = drone.x;
        drone.jamIndicator.y = drone.y - 30;
    }

    processDelayedCommand(drone, targetX, targetY) {
        if (drone.droneData.isJammed) {
            if (drone.droneData.commandDelayTimer) {
                drone.droneData.commandDelayTimer.remove();
            }

            drone.droneData.pendingCommand = { targetX, targetY };

            drone.droneData.commandDelayTimer = this.time.delayedCall(
                CONFIG.ew.commandDelay,
                () => {
                    if (drone.droneData.isAlive && drone.droneData.pendingCommand) {
                        drone.droneData.targetX = drone.droneData.pendingCommand.targetX;
                        drone.droneData.targetY = drone.droneData.pendingCommand.targetY;
                        drone.droneData.isMoving = true;
                        drone.droneData.pendingCommand = null;
                    }
                }
            );

            this.showMessage('📡 Komut gecikiyor...', 500);
        } else {
            drone.droneData.targetX = targetX;
            drone.droneData.targetY = targetY;
            drone.droneData.isMoving = true;
        }
    }

    // === DÜŞMAN OLUŞTURMA ===
    createEnemy(type, x, y, config = {}) {
        let enemy;

        if (type === 'tank') {
            enemy = this.add.rectangle(x, y, CONFIG.enemy.tank.size, CONFIG.enemy.tank.size, CONFIG.enemy.tank.color);
        } else if (type === 'patrol') {
            enemy = this.add.circle(x, y, CONFIG.enemy.patrol.size, CONFIG.enemy.patrol.color);
        }

        enemy.enemyData = {
            type: type,
            isRevealed: false,
            isVisible: false,
            ...config
        };

        if (type === 'patrol') {
            enemy.visionCone = this.add.graphics();
            enemy.enemyData.direction = 1;
            enemy.enemyData.facingAngle = 0;
        }

        enemy.setVisible(false);

        return enemy;
    }

    createEnemies() {
        const tank1 = this.createEnemy('tank', 300, 200, { name: 'TANK #1' });
        enemies.push(tank1);

        const tank2 = this.createEnemy('tank', 700, 250, { name: 'TANK #2' });
        enemies.push(tank2);

        const patrol = this.createEnemy('patrol', 500, 300, {
            name: 'DEVRIYE',
            minX: CONFIG.enemy.patrol.minX,
            maxX: CONFIG.enemy.patrol.maxX,
            speed: CONFIG.enemy.patrol.speed
        });
        enemies.push(patrol);
    }

    // === FOG OF WAR ===
    createFogOfWar() {
        this.exploredRT = this.add.renderTexture(0, 0, CONFIG.width, CONFIG.height);
        this.exploredRT.setVisible(false);

        fogGraphics = this.add.graphics();
        fogGraphics.setDepth(100);

        this.exploredGraphics = this.add.graphics();
        this.exploredGraphics.setDepth(99);
    }

    renderFogOfWar() {
        fogGraphics.clear();
        this.exploredGraphics.clear();

        const activeAreas = [];
        drones.forEach(drone => {
            if (drone.droneData.isAlive) {
                const radius = drone.droneData.currentVisionRadius || drone.droneData.visionRadius;
                if (radius > 0) {
                    activeAreas.push({ x: drone.x, y: drone.y, r: radius });
                    exploredAreas.push({ x: drone.x, y: drone.y, radius: radius });
                }
            }
        });

        fogGraphics.fillStyle(0x000000, 1);
        fogGraphics.fillRect(0, 0, CONFIG.width, CONFIG.height);

        exploredAreas.forEach(area => {
            fogGraphics.fillStyle(0x000000, 0.5);
            fogGraphics.fillCircle(area.x, area.y, area.radius);
        });

        activeAreas.forEach(area => {
            fogGraphics.fillStyle(0x1a2f1a, 1);
            fogGraphics.fillCircle(area.x, area.y, area.r);
        });
    }

    updateUI() {
        const aliveDrones = drones.filter(d => d.droneData.isAlive).length;
        droneCountText.setText(`DRONE: ${aliveDrones}/${CONFIG.drone.count}`);

        detectionCountText.setText(`TESPİT: ${detectedEnemies.size}/3`);

        const minutes = Math.floor(remainingTime / 60);
        const seconds = remainingTime % 60;
        timerText.setText(`SÜRE: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`);

        if (remainingTime <= 30) timerText.setColor('#ff3333');
        else if (remainingTime <= 60) timerText.setColor('#ffaa00');

        // EW geri sayım
        if (!ewDestroyed) {
            const ewTimeLeft = CONFIG.ew.activationTime - (CONFIG.game.duration - remainingTime);
            if (!ewActive && ewTimeLeft > 0) {
                this.ewCountdownText.setText(`Aktivasyon: ${ewTimeLeft}sn`);
            } else {
                this.ewCountdownText.setText('');
            }
        } else {
            this.ewCountdownText.setText('');
        }

        // EW durumu
        if (ewDestroyed) {
            ewStatusText.setText('EW: YOK EDİLDİ');
            ewStatusText.setColor('#00ff00');
        } else if (ewActive) {
            const jammedCount = drones.filter(d => d.droneData.isAlive && d.droneData.isJammed).length;
            ewStatusText.setText(jammedCount > 0 ? `EW: AKTİF (${jammedCount} etki altında)` : 'EW: AKTİF');
            ewStatusText.setColor('#ff3333');
        } else {
            ewStatusText.setText('EW: PASİF');
            ewStatusText.setColor('#00ff00');
        }

        // Decoy durumu
        if (decoyPlaced && decoyActive) {
            decoyText.setText(`📡 DECOY: AKTİF (${decoyTimer}sn)`);
            decoyText.setColor('#00ff00');
        } else if (decoyCount > 0) {
            decoyText.setText(`📡 DECOY: ${decoyCount} [D]`);
            decoyText.setColor('#00ff00');
        } else {
            decoyText.setText('📡 DECOY: KULLANILDI');
            decoyText.setColor('#888888');
        }

        // Counter-Vision durumu
        if (counterVisionActive) {
            counterVisionWarningText.setVisible(true);

            if (counterVisionPaused) {
                const pauseSeconds = Math.ceil(counterVisionPauseTime / 1000);
                counterVisionStatusText.setText(`Düşman decoy'u tarıyor... (${pauseSeconds}sn)`);
            } else if (counterVisionReachedEnd) {
                counterVisionStatusText.setText(`💀 TOPÇU ATIŞI: ${enemyArtilleryCountdown}sn`);
                counterVisionStatusText.setColor('#ff0000');
            } else {
                const distance = CONFIG.counterVision.endY - counterVisionY;
                const timeToEnd = Math.ceil(distance / CONFIG.counterVision.speed);
                counterVisionStatusText.setText(`Tarama: Y=${Math.round(counterVisionY)} | Varış: ${timeToEnd}sn`);
            }
        }

        this.updateRFStatusUI();
    }

    showMessage(text, duration = CONFIG.game.detectionMessageDuration) {
        messageText.setText(text);
        messageText.setAlpha(1);

        this.tweens.add({
            targets: messageText,
            alpha: 0,
            duration: duration,
            ease: 'Power2'
        });
    }

    // === INPUT ===
    setupInput() {
        this.input.on('pointerdown', (pointer) => {
            if (gameOver) return;

            if (pointer.leftButtonDown()) {
                if (decoyMode) {
                    this.placeDecoy(pointer.x, pointer.y);
                } else {
                    this.handleLeftClick(pointer);
                }
            } else if (pointer.rightButtonDown()) {
                this.handleRightClick(pointer);
            }
        });

        this.input.on('pointermove', (pointer) => {
            this.updateDecoyPreview(pointer);
        });

        this.input.mouse.disableContextMenu();

        // SPACE: Topçu
        this.input.keyboard.on('keydown-SPACE', () => {
            if (gameOver) return;
            if (artilleryReady && !artilleryFiring) {
                this.fireArtillery();
            }
        });

        // D: Decoy
        this.input.keyboard.on('keydown-D', () => {
            if (gameOver) return;
            this.toggleDecoyMode();
        });

        // ESC: Decoy modunu iptal
        this.input.keyboard.on('keydown-ESC', () => {
            decoyMode = false;
            if (decoyPreview) decoyPreview.setVisible(false);
        });
    }

    handleLeftClick(pointer) {
        let clickedDrone = null;

        drones.forEach(drone => {
            if (!drone.droneData.isAlive) return;

            const dist = Phaser.Math.Distance.Between(pointer.x, pointer.y, drone.x, drone.y);
            if (dist < CONFIG.drone.size + 10) {
                clickedDrone = drone;
            }
        });

        if (selectedDrone) {
            selectedDrone.highlight.setVisible(false);
            selectedDrone.droneData.isSelected = false;
        }

        if (clickedDrone) {
            selectedDrone = clickedDrone;
            selectedDrone.highlight.setVisible(true);
            selectedDrone.droneData.isSelected = true;
        } else {
            selectedDrone = null;
        }
    }

    handleRightClick(pointer) {
        if (!selectedDrone || !selectedDrone.droneData.isAlive) return;

        const marker = this.add.circle(pointer.x, pointer.y, 10, 0x00ff00, 0.5);
        this.tweens.add({
            targets: marker,
            scale: 2,
            alpha: 0,
            duration: 500,
            onComplete: () => marker.destroy()
        });

        this.processDelayedCommand(selectedDrone, pointer.x, pointer.y);
    }

    // === ZAMANLAYICI ===
    startTimer() {
        gameTimer = this.time.addEvent({
            delay: 1000,
            callback: () => {
                if (gameOver) return;

                remainingTime--;
                this.updateUI();

                if (remainingTime <= 0) {
                    this.endGame(false, 'SÜRE DOLDU!');
                }
            },
            loop: true
        });
    }

    // === OYUN DÖNGÜSÜ ===
    update(time, delta) {
        if (gameOver) return;

        this.updateDrones(delta);
        this.updateEnemies(delta);
        this.checkEWEffect();
        this.drawEWArea();
        this.drawEWBorder();
        this.updateRFSignals();

        // Counter-Vision
        this.checkCounterVisionActivation();
        this.updateCounterVision(delta);
        this.drawCounterVision();

        // Decoy
        this.drawDecoy();

        this.checkVisibility();
        this.renderFogOfWar();
        this.drawPatrolVisionCone();
        this.checkPatrolDetection();
        this.updateUI();
        this.checkWinCondition();
    }

    updateDrones(delta) {
        const speed = CONFIG.drone.speed * (delta / 1000);

        drones.forEach(drone => {
            if (!drone.droneData.isAlive || !drone.droneData.isMoving) return;

            const dx = drone.droneData.targetX - drone.x;
            const dy = drone.droneData.targetY - drone.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 5) {
                drone.droneData.isMoving = false;
                return;
            }

            const moveX = (dx / dist) * speed;
            const moveY = (dy / dist) * speed;

            drone.x += moveX;
            drone.y += moveY;

            drone.highlight.x = drone.x;
            drone.highlight.y = drone.y;
            drone.visionCircle.x = drone.x;
            drone.visionCircle.y = drone.y;

            drone.rotation = Math.atan2(dy, dx) + Math.PI / 2;
        });
    }

    updateEnemies(delta) {
        const patrol = enemies.find(e => e.enemyData.type === 'patrol');
        if (!patrol) return;

        const speed = patrol.enemyData.speed * (delta / 1000);
        patrol.x += speed * patrol.enemyData.direction;

        if (patrol.x >= patrol.enemyData.maxX) {
            patrol.x = patrol.enemyData.maxX;
            patrol.enemyData.direction = -1;
            patrol.enemyData.facingAngle = 180;
        } else if (patrol.x <= patrol.enemyData.minX) {
            patrol.x = patrol.enemyData.minX;
            patrol.enemyData.direction = 1;
            patrol.enemyData.facingAngle = 0;
        }
    }

    drawPatrolVisionCone() {
        const patrol = enemies.find(e => e.enemyData.type === 'patrol');
        if (!patrol || !patrol.visionCone) return;

        patrol.visionCone.clear();

        if (!patrol.enemyData.isVisible && !patrol.enemyData.isRevealed) return;

        const angle = patrol.enemyData.facingAngle;
        const halfAngle = CONFIG.enemy.patrol.visionAngle / 2;
        const range = CONFIG.enemy.patrol.visionRange;

        patrol.visionCone.fillStyle(0xff0000, 0.3);
        patrol.visionCone.beginPath();
        patrol.visionCone.moveTo(patrol.x, patrol.y);

        const startAngle = Phaser.Math.DegToRad(angle - halfAngle);
        const endAngle = Phaser.Math.DegToRad(angle + halfAngle);

        const segments = 20;
        for (let i = 0; i <= segments; i++) {
            const a = startAngle + (endAngle - startAngle) * (i / segments);
            const x = patrol.x + Math.cos(a) * range;
            const y = patrol.y + Math.sin(a) * range;
            patrol.visionCone.lineTo(x, y);
        }

        patrol.visionCone.closePath();
        patrol.visionCone.fillPath();
        patrol.visionCone.setDepth(50);
    }

    checkVisibility() {
        enemies.forEach(enemy => {
            let isCurrentlyVisible = false;

            drones.forEach(drone => {
                if (!drone.droneData.isAlive) return;

                const visionRadius = drone.droneData.currentVisionRadius || drone.droneData.visionRadius;
                const dist = Phaser.Math.Distance.Between(drone.x, drone.y, enemy.x, enemy.y);

                if (dist <= visionRadius) {
                    isCurrentlyVisible = true;

                    if (!enemy.enemyData.isRevealed) {
                        enemy.enemyData.isRevealed = true;
                        detectedEnemies.add(enemy);
                        this.showMessage(`⚠️ HEDEF TESPİT EDİLDİ: ${enemy.enemyData.name} ⚠️`);
                    }
                }
            });

            enemy.enemyData.isVisible = isCurrentlyVisible;

            if (isCurrentlyVisible || enemy.enemyData.isRevealed) {
                enemy.setVisible(true);
                enemy.setAlpha(isCurrentlyVisible ? 1 : 0.5);
            }
        });
    }

    checkPatrolDetection() {
        const patrol = enemies.find(e => e.enemyData.type === 'patrol');
        if (!patrol) return;

        const angle = patrol.enemyData.facingAngle;
        const halfAngle = CONFIG.enemy.patrol.visionAngle / 2;
        const range = CONFIG.enemy.patrol.visionRange;

        drones.forEach(drone => {
            if (!drone.droneData.isAlive) return;

            const dist = Phaser.Math.Distance.Between(patrol.x, patrol.y, drone.x, drone.y);
            if (dist > range) return;

            const angleToDrone = Phaser.Math.RadToDeg(Math.atan2(drone.y - patrol.y, drone.x - patrol.x));
            let angleDiff = angleToDrone - angle;

            while (angleDiff > 180) angleDiff -= 360;
            while (angleDiff < -180) angleDiff += 360;

            if (Math.abs(angleDiff) <= halfAngle) {
                this.droneDetected(drone);
            }
        });
    }

    droneDetected(drone) {
        if (!drone.droneData.isAlive) return;

        this.showMessage('🚨 TESPİT EDİLDİN! 🚨', CONFIG.game.droneDestroyDelay);
        drone.setTint(0xff0000);

        this.time.delayedCall(CONFIG.game.droneDestroyDelay, () => {
            this.destroyDrone(drone);
        });

        drone.droneData.isAlive = false;
    }

    destroyDrone(drone) {
        const explosion = this.add.circle(drone.x, drone.y, 5, 0xff6600);
        this.tweens.add({
            targets: explosion,
            scale: 4,
            alpha: 0,
            duration: 500,
            onComplete: () => explosion.destroy()
        });

        drone.setVisible(false);
        drone.highlight.setVisible(false);
        drone.visionCircle.setVisible(false);
        drone.jamIndicator.setVisible(false);

        if (selectedDrone === drone) selectedDrone = null;

        const aliveDrones = drones.filter(d => d.droneData.isAlive && d.visible !== false);
        if (aliveDrones.length === 0) {
            this.endGame(false, 'TÜM DRONE\'LAR YOK EDİLDİ!');
        }
    }

    checkWinCondition() {
        if (detectedEnemies.size >= 3) {
            this.endGame(true, 'TÜM HEDEFLER TESPİT EDİLDİ!');
        }
    }

    endGame(won, reason) {
        gameOver = true;

        if (gameTimer) gameTimer.remove();
        if (ewPulseTween) ewPulseTween.stop();

        const overlay = this.add.rectangle(CONFIG.width / 2, CONFIG.height / 2, CONFIG.width, CONFIG.height, 0x000000, 0.8);
        overlay.setDepth(300);

        const resultStyle = {
            fontFamily: 'Arial Black, sans-serif',
            fontSize: '48px',
            color: won ? '#00ff00' : '#ff0000',
            stroke: '#000000',
            strokeThickness: 6,
            align: 'center'
        };

        const title = won ? '🏆 MİSYON TAMAMLANDI 🏆' : '💀 MİSYON BAŞARISIZ 💀';
        const resultText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 - 50, title, resultStyle);
        resultText.setOrigin(0.5);
        resultText.setDepth(301);

        const reasonText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 + 30, reason, {
            fontFamily: 'Arial, sans-serif',
            fontSize: '24px',
            color: '#ffffff',
            stroke: '#000000',
            strokeThickness: 3
        });
        reasonText.setOrigin(0.5);
        reasonText.setDepth(301);

        const ewStatus = ewDestroyed ? 'YOK EDİLDİ' : (ewActive ? 'AKTİF' : 'PASİF');
        const stats = `Tespit: ${detectedEnemies.size}/3 | Drone: ${drones.filter(d => d.droneData.isAlive).length}/${CONFIG.drone.count} | EW: ${ewStatus}`;
        const statsText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 + 100, stats, {
            fontFamily: 'Arial, sans-serif',
            fontSize: '20px',
            color: '#aaaaaa',
            stroke: '#000000',
            strokeThickness: 2,
            align: 'center'
        });
        statsText.setOrigin(0.5);
        statsText.setDepth(301);

        const restartText = this.add.text(CONFIG.width / 2, CONFIG.height / 2 + 160, '[ TIKLA - YENİDEN BAŞLA ]', {
            fontFamily: 'Arial, sans-serif',
            fontSize: '22px',
            color: '#ffff00',
            stroke: '#000000',
            strokeThickness: 3
        });
        restartText.setOrigin(0.5);
        restartText.setDepth(301);
        restartText.setInteractive({ useHandCursor: true });

        restartText.on('pointerover', () => restartText.setScale(1.1));
        restartText.on('pointerout', () => restartText.setScale(1));
        restartText.on('pointerdown', () => this.scene.restart());
    }
}

// === PHASER KONFIGÜRASYONU ===
const gameConfig = {
    type: Phaser.AUTO,
    width: CONFIG.width,
    height: CONFIG.height,
    parent: 'game-container',
    backgroundColor: CONFIG.backgroundColor,
    scene: GameScene,
    physics: {
        default: 'arcade',
        arcade: { debug: false }
    }
};

const game = new Phaser.Game(gameConfig);
    </script>
